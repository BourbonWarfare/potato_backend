<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body>
    <!-- The top bar for the website -->
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="/" hx-get="/" hx-target="#view" hx-push-url="true">Home</a></li>
                <li><a href="/missions" hx-get="/missions" hx-target="#view" hx-push-url="true">Missions</a></li>
            </ul>
            <div class="nav-profile">
                {% if logged_in %}
                <a href="/user/profile" hx-get="/user/profile" hx-target="#view" hx-push-url="true">Profile</a>
                <form class="nav-logout-form" method="post" action="/api/v1/auth/logout" hx-post="/api/v1/auth/logout">
                    <button class="nav-logout-button" type="submit">Logout</button>
                </form>
                {% else %}
                <a href="/auth/register" hx-get="/auth/register" hx-target="#view" hx-push-url="true">Register</a>
                <a href="/auth/login" hx-get="/auth/login" hx-target="#view" hx-push-url="true">Login</a>
                {% endif %}
            </div>
        </nav>
    </header>
    <!-- The body of page the website. This gets filled out server-side -->
    <div id="view">
        {{ inner_html|safe }}
    </div>
</body>

</html>
