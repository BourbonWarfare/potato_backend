<div class="section-header arma-event-detail-header">
    <h1>Arma Event</h1>
    <i>{{ event.creation_date_human }}{% if event.server %} on {{ event.server }}{% endif %}</i>
</div>

<section class="container-card arma-event-detail-card">
    <div class="card-content arma-event-detail-content">
        <a class="arma-event-back-link" href="/server_ops/arma/events" hx-get="/server_ops/arma/events" hx-target="#view"
            hx-push-url="true">← Back to events</a>

        <dl class="arma-event-metadata">
            <div>
                <dt>Time</dt>
                <dd><time datetime="{{ event.creation_date }}">{{ event.creation_date_human }}</time></dd>
            </div>
            <div>
                <dt>Server</dt>
                <dd>{{ event.server }}</dd>
            </div>
            <div>
                <dt>Tag</dt>
                <dd><span class="arma-event-tag">{{ event.tag }}</span></dd>
            </div>
        </dl>

        <section class="arma-event-message-panel" aria-label="Event message">
            <h2>Message</h2>
            <div class="arma-event-message">{{ event.formatted_message|safe }}</div>
        </section>
    </div>
</section>

<script>
    document.querySelectorAll("pre code:not([data-highlighted])")
        .forEach(el => hljs.highlightElement(el));
</script>
