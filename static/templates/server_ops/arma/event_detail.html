<article class="arma-event-detail-shell">
    <nav class="arma-event-detail-nav" aria-label="Event navigation">
        <a class="arma-event-back-link" href="/server_ops/arma/events" hx-get="/server_ops/arma/events" hx-target="#view"
            hx-push-url="true">← Back to events</a>
    </nav>

    <header class="arma-event-detail-heading">
        <div>
            <p class="eyebrow">Arma Event</p>
            <h1>{{ event.tag }}</h1>
        </div>
        <time datetime="{{ event.creation_date }}">{{ event.creation_date_human }}</time>
    </header>

    <section class="arma-event-detail-meta" aria-label="Event metadata">
        <div>
            <span>Server</span>
            <strong>{{ event.server }}</strong>
        </div>
        <div>
            <span>Tag</span>
            <strong class="arma-event-tag">{{ event.tag }}</strong>
        </div>
        <div>
            <span>Event ID</span>
            <strong>#{{ event.id }}</strong>
        </div>
    </section>

    <section class="arma-event-detail-message" aria-label="Event message">
        <h2>Message</h2>
        <div class="arma-event-message">{{ event.formatted_message|safe }}</div>
    </section>
</article>

<script>
    document.querySelectorAll("pre code:not([data-highlighted])")
        .forEach(el => hljs.highlightElement(el));
</script>
