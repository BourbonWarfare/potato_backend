<div class="container-card auth-card" id="auth-card">
    <div class="card-content" id="auth-card-content">

        <div class="auth-header">
            <h2>Recover Account</h2>
            <p>An e-mail will be sent to the email address with instructions on how to recover the account.</p>
        </div>

        <form method="POST" hx-post="/api/v1/user/recover" hx-target="#auth-card-content" hx-trigger="submit"
            class="auth-form" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email"
                    autocapitalize="off" required />
            </div>
            <button type="submit" class="btn-primary">Recover</button>
        </form>
    </div>
</div>
