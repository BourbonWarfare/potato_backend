<div class="container-card auth-card" id="auth-card">
    <div class="card-content" id="auth-card-content">
        <div class="auth-header">
            <h2>Success!</h2>
            <h4>You have created your Bourbon Warfare account</h4>
        </div>
        <p>
            Hi <b>{{ username }}</b>, an email has been sent to <b>{{ email }}</b> which will allow you to verify your
            account.
        </p>
        <div id="resend-verification-status" class="auth-error" aria-live="polite"></div>
        <form method="POST" hx-post="/api/v1/user/verify/resend" hx-target="#resend-verification-status"
            hx-trigger="submit" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
            <input type="hidden" name="email" value="{{ email }}" />
            <button type="submit" class="btn-primary">Resend verification email</button>
        </form>
    </div>
</div>
