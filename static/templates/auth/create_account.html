<div id="error-banner" class="auth-error" aria-live="polite"></div>
<div class="container-card auth-card" id="auth-card">
    <div class="card-content" id="auth-card-content">

        <div class="auth-header">
            <h2>Create Bourbon Warfare account</h2>
            <p>Use Discord for a quick account, or create Bourbon credentials below.</p>
        </div>

        <div class="oauth-grid">
            <a href="/auth/discord" class="oauth-btn discord">
                <img src="/static/svg/discord.svg" class="discord-logo" alt="Discord logo" />
                Continue with Discord
            </a>
        </div>

        <div class="login-divider"><span>or</span></div>

        <form method="POST" hx-post="/api/v1/user/register" hx-target="#error-banner" hx-trigger="submit"
            class="auth-form" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email"
                    autocapitalize="off" required />
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" autocomplete="username" autocapitalize="off"
                    required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" autocomplete="new-password" required />
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account?
                <a href="/auth/login" hx-get="/auth/login" hx-target="#auth-card" hx-swap="outerHTML"
                    hx-push-url="true">
                    Sign in
                </a>
            </p>
        </div>
    </div>
</div>
